name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex/upsk-system-design-workspace/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: codex/upsk-system-design-workspace/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex/upsk-system-design-workspace/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: codex/upsk-system-design-workspace/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/apigw-test
          IMAGE_NAME_LOWER=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')
          docker build \
            -t $IMAGE_NAME_LOWER:${{ github.sha }} \
            -t $IMAGE_NAME_LOWER:latest \
            -f codex/upsk-system-design-workspace/api/Dockerfile \
            codex/upsk-system-design-workspace/api

      - name: Check image size threshold
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/apigw-test
          IMAGE_NAME_LOWER=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')
          SIZE=$(docker image inspect $IMAGE_NAME_LOWER:${{ github.sha }} --format='{{.Size}}')
          if [ "$SIZE" -gt 209715200 ]; then
            echo "Image size ($SIZE bytes) exceeds 200MB limit!"
            exit 1
          else
            echo "Image size ($SIZE bytes) is within threshold."
          fi

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/apigw-test
          IMAGE_NAME_LOWER=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')
          docker push $IMAGE_NAME_LOWER:${{ github.sha }}
          docker push $IMAGE_NAME_LOWER:latest
